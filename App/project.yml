name: GemmaTrans
options:
  bundleIdPrefix: com.gemmatrans
  deploymentTarget:
    macOS: "26.0"
packages:
  GemmaTransCore:
    path: ../
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  GemmaTrans:
    type: application
    platform: macOS
    sources: [GemmaTrans]
    info:
      path: GemmaTrans/Info.plist
      properties:
        LSUIElement: true            # menu bar app，不出现在 Dock
        CFBundleDisplayName: GemmaTrans
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "15"
        ITSAppUsesNonExemptEncryption: false   # 仅用豁免加密(HTTPS)，自动声明出口合规，免去上传后手填
        NSServices:                  # 选中文字 →「服务」菜单翻译（替代辅助功能，零权限）
          - NSMenuItem:
              default: Translate with GemmaTrans
            NSKeyEquivalent:
              default: "~@t"        # ⌥⌘T 默认快捷键：选中文字按一下即翻译（用户可在系统设置改）
            NSMessage: translateSelection
            NSPortName: GemmaTrans
            NSRequiredContext: {}
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
    dependencies:
      - package: GemmaTransCore
        product: GemmaTransKit
      - package: GemmaTransCore
        product: GemmaTransServer
      - package: KeyboardShortcuts
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        # 稳定签名身份：ad-hoc 每次重建 cdhash 都变，TCC 辅助功能授权会随重建失效；
        # Apple Development 证书签名后授权按"团队+Bundle ID"绑定，重建不丢权限
        DEVELOPMENT_TEAM: G2XC9VU88M
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "15"
      configs:
        Release:
          # 公证直分：Developer ID + Hardened Runtime（Debug 日常开发不受影响）
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: YES
          # 公证要求：签名带安全时间戳；去掉 build 动作默认注入的 get-task-allow 调试 entitlement
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  GemmaTrans-MAS:
    type: application
    platform: macOS
    sources: [GemmaTrans]
    info:
      path: GemmaTrans/Info.plist
      properties:
        LSUIElement: true            # 纯菜单栏 app（无 Dock 图标）：划词时不被前台化，浮窗只出现在当前 Space
        CFBundleDisplayName: GemmaTrans
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "15"
        ITSAppUsesNonExemptEncryption: false   # 仅用豁免加密(HTTPS)，自动声明出口合规，免去上传后手填
        NSServices:                  # 选中文字 →「服务」菜单翻译（替代辅助功能，零权限）
          - NSMenuItem:
              default: Translate with GemmaTrans
            NSKeyEquivalent:
              default: "~@t"        # ⌥⌘T 默认快捷键：选中文字按一下即翻译（用户可在系统设置改）
            NSMessage: translateSelection
            NSPortName: GemmaTrans
            NSRequiredContext: {}
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
    entitlements:
      path: GemmaTrans-MAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    dependencies:
      - package: GemmaTransCore
        product: GemmaTransKit
      - package: GemmaTransCore
        product: GemmaTransServer
      - package: KeyboardShortcuts
    settings:
      base:
        DEVELOPMENT_TEAM: G2XC9VU88M
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "15"
        PRODUCT_BUNDLE_IDENTIFIER: com.gemmatrans.GemmaTrans
        PRODUCT_NAME: GemmaTrans
