name: GemmaTrans
options:
  bundleIdPrefix: com.gemmatrans
  deploymentTarget:
    macOS: '15.0'
packages:
  GemmaTransCore:
    path: ../
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  GemmaTrans:
    sources:
    - GemmaTrans
    - Composition
    info:
      path: GemmaTrans/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: GemmaTrans
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "2.2.0"
        CFBundleVersion: "26"
        ITSAppUsesNonExemptEncryption: false
        NSServices:
        - NSMenuItem:
            default: Translate with GemmaTrans
          NSKeyEquivalent:
            default: ~@t
          NSMessage: translateSelection
          NSPortName: GemmaTrans
          NSRequiredContext: {}
          NSSendTypes:
          - NSStringPboardType
          - public.utf8-plain-text
    settings:
      base:
        ENABLE_APP_SANDBOX: false
        DEVELOPMENT_TEAM: G2XC9VU88M
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: '6.0'
        ARCHS: arm64
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "26"
      configs:
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: true
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    templates:
    - GemmaTransShared
  GemmaTrans-MAS:
    sources:
    - GemmaTrans
    - Composition
    info:
      path: GemmaTrans/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: GemmaTrans
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "2.2.0"
        CFBundleVersion: "26"
        ITSAppUsesNonExemptEncryption: false
        NSServices:
        - NSMenuItem:
            default: Translate with GemmaTrans
          NSKeyEquivalent:
            default: ~@t
          NSMessage: translateSelection
          NSPortName: GemmaTrans
          NSRequiredContext: {}
          NSSendTypes:
          - NSStringPboardType
          - public.utf8-plain-text
    entitlements:
      path: GemmaTrans-MAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        DEVELOPMENT_TEAM: G2XC9VU88M
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: '6.0'
        ARCHS: arm64
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "26"
        PRODUCT_BUNDLE_IDENTIFIER: com.gemmatrans.GemmaTrans
        PRODUCT_NAME: GemmaTrans
    templates:
    - GemmaTransShared
include:
- shared-targets.yml
