name: Release MAS (App Store)

# 在 GitHub 托管的 macOS runner 上构建 Mac App Store 版并上传到 App Store Connect。
# 关键点：托管 runner 自带 Apple 认可的 Xcode 版本 —— 用它打包可避开本地 beta/超前 SDK
# 导致的 ITMS-90301（"不接受用此 OS 版本构建的 App"）。
#
# 手动触发：Actions → Release MAS → Run workflow，填入高于 App Store Connect 现有值的 build_number。
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion / build 号（必须高于 App Store Connect 现有值）"
        required: true
        type: string
      xcode_version:
        description: "选用的 Xcode（留空=用 runner 默认稳定版；ITMS-90301 时改成更早的正式版）"
        required: false
        default: ""
        type: string

jobs:
  build-upload:
    runs-on: macos-15            # GitHub 托管 runner（非 self-hosted），自带多版本 Xcode
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: 校验发布凭证配置
        env:
          DIST_CERT_P12: ${{ secrets.MAS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PWD: ${{ secrets.MAS_DIST_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PWD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for NAME in DIST_CERT_P12 DIST_CERT_PWD INSTALLER_CERT_P12 INSTALLER_CERT_PWD PROFILE_B64 ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!NAME:-}" ]; then
              echo "::error::缺少 Actions Secret 对应的 $NAME"
              exit 1
            fi
          done

      - name: 列出可用 Xcode 并选版本
        run: |
          set -euo pipefail
          echo "可用 Xcode："; ls -d /Applications/Xcode*.app
          if [ -n "${{ inputs.xcode_version }}" ]; then
            SELECTED="/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          else
            SELECTED=""
            for APP in $(find /Applications -maxdepth 1 -name 'Xcode*.app' ! -iname '*beta*' -print | sort -r); do
              DEV="$APP/Contents/Developer"
              SDK_VERSION="$(DEVELOPER_DIR="$DEV" xcrun --sdk macosx --show-sdk-version 2>/dev/null || true)"
              SDK_MAJOR="${SDK_VERSION%%.*}"
              if [[ "$SDK_MAJOR" =~ ^[0-9]+$ ]] && [ "$SDK_MAJOR" -ge 26 ]; then
                SELECTED="$DEV"
                break
              fi
            done
          fi
          if [ ! -d "$SELECTED" ]; then
            echo "::error::Runner 没有符合要求的正式版 Xcode"
            exit 1
          fi
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$SELECTED"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "SDK version：$SDK_VERSION"
          echo "SDK build：$(xcrun --sdk macosx --show-sdk-build-version)"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::GemmaTrans 2.0 需要 macOS 26 SDK；请选择包含该 SDK 的正式版 Xcode"
            exit 1
          fi

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 准备 Metal 工具链（MLX 着色器编译需要）
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: 导入签名证书 + 描述文件到临时钥匙串
        env:
          DIST_CERT_P12: ${{ secrets.MAS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PWD: ${{ secrets.MAS_DIST_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PWD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.MAS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPWD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Apple Distribution（app 签名）
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild
          # 3rd Party Mac Developer Installer（pkg 签名）
          echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KC" -P "$INSTALLER_CERT_PWD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPWD" "$KC" >/dev/null
          # 描述文件
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/GemmaTrans_MAS.provisionprofile"
          rm -f "$RUNNER_TEMP"/*.p12

      - name: 写入 App Store Connect API Key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"

      - name: 设置 build 号并生成工程
        run: |
          set -euo pipefail
          BN="${{ inputs.build_number }}"
          if ! [[ "$BN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number 必须是正整数"
            exit 1
          fi
          # 同步 project.yml 里两个 target 的 build 号
          /usr/bin/sed -i '' -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"$BN\"/g; s/CFBundleVersion: \"[0-9]+\"/CFBundleVersion: \"$BN\"/g" App/project.yml
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|CFBundleVersion' App/project.yml
          ( cd App && xcodegen generate )

      - name: Archive（MAS / Apple Distribution）
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/GemmaTrans-MAS.xcarchive"
          xcodebuild -project App/GemmaTrans.xcodeproj -scheme GemmaTrans-MAS \
            -configuration Release -skipMacroValidation -skipPackagePluginValidation \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/GemmaTrans-MAS.xcarchive" \
            clean archive

      - name: 导出 .pkg（App Store Connect 方式）
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/mas-export"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GemmaTrans-MAS.xcarchive" \
            -exportPath "$RUNNER_TEMP/mas-export" \
            -exportOptionsPlist dist/mas/ExportOptions.plist -allowProvisioningUpdates
          PKG="$(ls "$RUNNER_TEMP"/mas-export/*.pkg | head -1)"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          # 校验导出的 app 是 Apple Distribution 签名
          /usr/bin/pkgutil --check-signature "$PKG" | head -3

      - name: 上传到 App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --upload-app -t macos -f "$PKG" \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_ISSUER_ID }}"
          echo "✅ 已上传 build ${{ inputs.build_number }}。提审：在 App Store Connect 关联该 build 并提交审核。"

      - name: 留存 .pkg 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GemmaTrans-MAS-pkg
          path: ${{ runner.temp }}/mas-export/*.pkg
          if-no-files-found: ignore
